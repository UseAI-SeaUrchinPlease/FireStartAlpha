name: Deploy site to GitHub Pages

# サイト = ゲームの Web 版(ルート) + Issue 依存関係ページ(/deps/)。
# - ゲームは常に main をビルドして公開する(リリース = main への push)
# - 依存関係ページは dev(デフォルトブランチ)側で動く Issue/PR/cron のイベントで更新する
#   (issues / pull_request_target / schedule はデフォルトブランチのワークフローしか使われない)
# Pages のデプロイはこの1本に集約する(concurrency で直列化され、互いに上書き・取り消しをしない)。
# ゲームのビルドは main のコミットごとにキャッシュするので、Issue/PR イベントでは Godot を再ビルドしない。
on:
  push:
    branches: [main]
  issues:
    types: [opened, edited, closed, reopened, deleted, transferred, assigned, unassigned]
  # pull_request_target はデフォルトブランチ側のコードで動くので、PR の中身は実行されない。
  # 書き込み系の権限を持つため、PR の head は checkout しないこと
  pull_request_target:
    types: [opened, reopened, closed, ready_for_review, converted_to_draft, edited]
  schedule:
    # 依存関係(blocked by)の変更は issues イベントで拾えないことがあるため、定期実行で補う
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: read
  pull-requests: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 依存ページ生成のツールは、イベントが起きたブランチ(Issue 等は dev)のものを使う
      - name: Checkout (tools)
        uses: actions/checkout@v4

      # ゲームは実行中のブランチによらず常に main をビルドする
      - name: Checkout (game, main)
        id: game-src
        uses: actions/checkout@v4
        with:
          ref: main
          path: game-src

      - name: Get main commit
        id: main-sha
        run: echo "sha=$(git -C game-src rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore game build cache
        id: game-cache
        uses: actions/cache@v4
        with:
          path: build/game
          key: game-web-${{ steps.main-sha.outputs.sha }}

      - name: Setup Godot
        if: steps.game-cache.outputs.cache-hit != 'true'
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Verify Godot version
        if: steps.game-cache.outputs.cache-hit != 'true'
        run: godot --version

      - name: Import project resources
        if: steps.game-cache.outputs.cache-hit != 'true'
        run: godot --headless --path game-src --import

      - name: Export web build
        if: steps.game-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p build/game
          godot --headless --path game-src --export-release "Web" "$GITHUB_WORKSPACE/build/game/index.html"

      - name: Assemble site
        run: |
          mkdir -p build/site
          cp -r build/game/. build/site/

      - name: Generate dependency page
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -I tools/deps_page/build.py build/site/deps

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
