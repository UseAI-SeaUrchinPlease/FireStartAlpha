name: Deploy game (main)

# main へのリリースで、ゲームの Web 版と依存関係ページを公開する。実体は site.yml。
# Issue/PR の更新による依存ページの更新は deploy-deps.yml(dev 側)が担当する。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: read
  pull-requests: read

# Pages のデプロイは deploy-deps.yml と同じグループで直列化する
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  site:
    uses: ./.github/workflows/site.yml
