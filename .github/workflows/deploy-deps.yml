name: Update dependency page (dev)

# Issue/PR の更新と定期実行で、依存関係ページを更新する。公開中のゲームは変えない(常に main をビルド)。
# issues / pull_request_target / schedule はデフォルトブランチ(dev)のワークフローしか使われない。
# 実体は site.yml。
on:
  issues:
    types: [opened, edited, closed, reopened, deleted, transferred, assigned, unassigned]
  # pull_request_target はデフォルトブランチ側のコードで動くので、PR の中身は実行されない。
  # 書き込み系の権限を持つため、PR の head は checkout しないこと
  pull_request_target:
    types: [opened, reopened, closed, ready_for_review, converted_to_draft, edited]
  schedule:
    # 依存関係(blocked by)の変更は issues イベントで拾えないことがあるため、定期実行で補う
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: read
  pull-requests: read

# Pages のデプロイは deploy-web.yml と同じグループで直列化する
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  site:
    uses: ./.github/workflows/site.yml
