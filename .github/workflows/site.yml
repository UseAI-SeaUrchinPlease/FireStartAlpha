name: Build and deploy site

# deploy-web.yml(main へのリリース)と deploy-deps.yml(Issue/PR/cron)から呼ばれる共通部分。
# サイト = ゲームの Web 版(ルート) + Issue 依存関係ページ(/deps/)。Pages は1サイトなので、
# どちらから呼ばれても両方を含めて作り直す。
# - ゲームは呼び出し元のブランチによらず常に main をビルドし、main のコミットごとにキャッシュする
# - 依存ページ生成のツールは、呼び出し元のブランチ(Issue 等は dev)のものを使う
on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 依存ページ生成のツールは、イベントが起きたブランチ(Issue 等は dev)のものを使う
      - name: Checkout (tools)
        uses: actions/checkout@v4

      # ゲームは実行中のブランチによらず常に main をビルドする
      - name: Checkout (game, main)
        id: game-src
        uses: actions/checkout@v4
        with:
          ref: main
          path: game-src

      - name: Get main commit
        id: main-sha
        run: echo "sha=$(git -C game-src rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore game build cache
        id: game-cache
        uses: actions/cache@v4
        with:
          path: build/game
          key: game-web-${{ steps.main-sha.outputs.sha }}

      - name: Setup Godot
        if: steps.game-cache.outputs.cache-hit != 'true'
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Verify Godot version
        if: steps.game-cache.outputs.cache-hit != 'true'
        run: godot --version

      - name: Import project resources
        if: steps.game-cache.outputs.cache-hit != 'true'
        run: godot --headless --path game-src --import

      - name: Export web build
        if: steps.game-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p build/game
          godot --headless --path game-src --export-release "Web" "$GITHUB_WORKSPACE/build/game/index.html"

      - name: Assemble site
        run: |
          mkdir -p build/site
          cp -r build/game/. build/site/

      - name: Generate dependency page
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -I tools/deps_page/build.py build/site/deps

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
